name: App checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python and check JavaScript
        run: |
          python -m compileall -q app cloud tests
          node --check app/static/app.js
      - name: Unit tests (alignment, phrasing, lyrics lookup)
        run: python -m unittest discover -s tests -v
